<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تعديل الصنف</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', Tahoma, sans-serif; background: url('{{ url_for("static", filename="stadium.jpg") }}') no-repeat center center fixed; background-size: cover; min-height: 100vh; padding: 20px; color: #fff; display: flex; justify-content: center; align-items: center; }
    .box { background: rgba(15, 32, 39, 0.8); backdrop-filter: blur(15px); padding: 30px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.2); width: 100%; max-width: 400px; }
    h2 { text-align: center; margin-bottom: 20px; }
    label { display: block; margin-top: 10px; font-size: 14px; }
    input, select { width: 100%; padding: 10px; margin: 5px 0; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); border-radius: 6px; color: #fff; font-family: 'Cairo'; }
    button { width: 100%; padding: 12px; background: #f39c12; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 15px; }
    .back-link { display: block; text-align: center; margin-top: 15px; color: #4facfe; text-decoration: none; }
  </style>
</head>
<body>
  <div class="box">
    <h2>✏️ تعديل الصنف</h2>
    <form method="post">
      <label>كود الصنف:</label>
      <input name="code" value="{{ item.code }}" required readonly style="background: rgba(255,255,255,0.05);">
      
      <label>اسم الصنف:</label>
      <input name="name" value="{{ item.name }}" required>
      
      <label>الوحدة:</label>
      <input name="unit" value="{{ item.unit }}" required>
      
      <label>القسم:</label>
      <select name="category">
        <option value="عام" {% if item.category == 'عام' %}selected{% endif %}>عام</option>
        <option value="المطبخ" {% if item.category == 'المطبخ' %}selected{% endif %}>المطبخ</option>
        <option value="مواد بناء" {% if item.category == 'مواد بناء' %}selected{% endif %}>مواد بناء</option>
        <option value="قطع غيار" {% if item.category == 'قطع غيار' %}selected{% endif %}>قطع غيار</option>
        <option value="كهرباء" {% if item.category == 'كهرباء' %}selected{% endif %}>كهرباء</option>
        <option value="سباكة" {% if item.category == 'سباكة' %}selected{% endif %}>سباكة</option>
        <option value="سلامة" {% if item.category == 'سلامة' %}selected{% endif %}>سلامة</option>
        <option value="مكتبية" {% if item.category == 'مكتبية' %}selected{% endif %}>مكتبية</option>
        <option value="أدوات" {% if item.category == 'أدوات' %}selected{% endif %}>أدوات</option>
      </select>
      
      <label>الحد الأدنى:</label>
      <input name="min_qty" type="number" value="{{ item.min_qty | int }}" required>
      
      <button type="submit">حفظ التعديلات</button>
    </form>
    <a href="{{ url_for('items') }}" class="back-link">العودة للأصناف</a>
  </div>
</body>
</html>
