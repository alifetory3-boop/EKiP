<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تعديل السجل المالي - المركب الرياضي بالمرج</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', Tahoma, sans-serif; }
    body { 
        background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)), url('{{ url_for("static", filename="stadium.jpg") }}') no-repeat center center fixed; 
        background-size: cover; min-height: 100vh; padding: 15px; color: #fff; 
    }
    header { 
        background: rgba(15, 32, 39, 0.9); backdrop-filter: blur(15px); padding: 10px 15px; border-radius: 8px; 
        display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); 
    }
    header a { color: #4facfe; text-decoration: none; font-weight: 700; font-size: 13px; background: rgba(255,255,255,0.08); padding: 5px 12px; border-radius: 6px; }
    
    .box { 
        background: rgba(15, 32, 39, 0.85); backdrop-filter: blur(10px); padding: 20px; border-radius: 8px; 
        margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); max-width: 800px; margin-left: auto; margin-right: auto; 
    }
    h3 { color: #fff; margin-bottom: 15px; font-weight: 800; border-bottom: 2px solid #4facfe; padding-bottom: 8px; font-size: 16px; }
    
    form { display: flex; flex-direction: column; gap: 12px; }
    .form-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .form-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 220px; }
    .form-group label { font-size: 12px; font-weight: 700; color: #4facfe; }
    
    input, select { 
        padding: 10px; background: rgba(255,255,255,0.95); border: 1px solid rgba(255,255,255,0.2); 
        border-radius: 6px; color: #000; font-size: 14px; font-weight: 600; width: 100%; 
    }
    
    .btn-submit { 
        padding: 10px 20px; background: #f39c12; color: #fff; border: none; border-radius: 6px; 
        cursor: pointer; font-weight: 700; font-size: 14px; margin-top: 10px; align-self: flex-start; transition: 0.3s; 
    }
    .btn-submit:hover { background: #d68910; }
  </style>
</head>
<body>
  <header>
    <div style="font-weight: 800; font-size: 16px;"><i class="fa-solid fa-pen-to-square"></i> تعديل بيانات السجل المالي</div>
    <a href="{{ url_for('salaries_management') }}"><i class="fa-solid fa-arrow-right"></i> رجوع للقائمة</a>
  </header>

  <div class="box">
    <h3>تعديل بيانات الموظف: {{ salary.employee_name }}</h3>
    <form method="post">
      <div class="form-row">
        <div class="form-group">
          <label>اسم الموظف</label>
          <input name="employee_name" value="{{ salary.employee_name }}" required>
        </div>
        <div class="form-group">
          <label>الراتب الأساسي</label>
          <input name="basic_salary" type="number" step="0.01" value="{{ salary.basic_salary }}" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>الخصومات / الجزاءات</label>
          <input name="deductions" type="number" step="0.01" value="{{ salary.deductions }}">
        </div>
        <div class="form-group">
          <label>المكافأة / الإضافي</label>
          <input name="bonuses" type="number" step="0.01" value="{{ salary.bonuses }}">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>السلفة</label>
          <input name="advance" type="number" step="0.01" value="{{ salary.advance }}">
        </div>
        <div class="form-group">
          <label>نوع إيصال المكافأة</label>
          <select name="bonus_receipt_type">
            <option value="separate" {% if salary.bonus_receipt_type == 'separate' %}selected{% endif %}>إيصال مكافأة مستقل</option>
            <option value="with_salary" {% if salary.bonus_receipt_type == 'with_salary' %}selected{% endif %}>مدمج مع إيصال الراتب</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group" style="flex: 1;">
          <label>الشهر / السنة</label>
          <input name="month_year" value="{{ salary.month_year }}" required>
        </div>
      </div>

      <button type="submit" class="btn-submit"><i class="fa-solid fa-check"></i> حفظ التعديلات</button>
    </form>
  </div>
</body>
</html>
