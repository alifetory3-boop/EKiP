<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ doc_title }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cairo', Tahoma, sans-serif; background: url('{{ url_for("static", filename="stadium.jpg") }}') no-repeat center center fixed; background-size: cover; min-height: 100vh; padding: 15px; color: #fff; }
    header { background: rgba(15, 32, 39, 0.85); backdrop-filter: blur(15px); padding: 12px 20px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); }
    header a { color: #4facfe; text-decoration: none; font-weight: bold; font-size: 14px; }
    
    .container { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 15px; width: 100%; max-width: 950px; margin-left: auto; margin-right: auto; }
    .form-box { background: rgba(15, 32, 39, 0.75); backdrop-filter: blur(15px); padding: 25px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); width: 100%; }
    
    h3 { color: #fff; margin-bottom: 20px; font-weight: 800; border-bottom: 2px solid #4facfe; padding-bottom: 10px; font-size: 18px; text-align: center; }
    
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
    
    input, select { width: 100%; padding: 10px; margin: 5px 0; background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; color: #fff; font-family: 'Cairo'; font-size: 14px; }
    input:focus, select:focus { outline: none; border-color: #4facfe; background: rgba(255, 255, 255, 0.25); }
    input::placeholder { color: #d1d5db; }
    select option { background: #0f2027; color: #fff; }
    
    label { display: block; margin-top: 5px; font-weight: 600; color: #e2e8f0; font-size: 13px; }
    
    .row { display: grid; grid-template-columns: 150px 1fr 90px 100px 40px; gap: 8px; margin-bottom: 10px; align-items: center; }
    @media (max-width: 768px) { .row { grid-template-columns: 1fr; } }
    
    .add-new-btn { background: #3498db; padding: 10px; border-radius: 8px; color: #fff; text-decoration: none; display: flex; align-items: center; justify-content: center; height: 40px; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 15px; background: rgba(255, 255, 255, 0.9); color: #000; border-radius: 8px; overflow: hidden; }
    th, td { padding: 10px; text-align: center; border-bottom: 1px solid #ddd; font-size: 13px; }
    th { background: #2c3e50; color: #fff; }
    
    .msg { padding: 10px; border-radius: 6px; text-align: center; margin-bottom: 15px; font-weight: bold; font-size: 13px; }
    .success { background: rgba(39, 174, 96, 0.9); }
    .danger { background: rgba(231, 76, 60, 0.9); }
    
    .btn { padding: 10px 20px; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.3s; width: 100%; margin-top: 10px; }
    .btn-success { background: #27ae60; }
    .btn-success:hover { background: #219653; }
    .btn-primary { background: #3498db; }
    .btn-primary:hover { background: #2980b9; }
  </style>
</head>
<body>
  <header>
    <div>🛒 {{ doc_title }}</div>
    <div><a href="{{ url_for('dashboard') }}">الرئيسية 🏠</a></div>
  </header>
  
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="msg {{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  <div class="container">
    <div class="form-box">
      <h3>{{ doc_title }}</h3>
      <form method="post">
        <div class="form-grid">
          <div>
            <label>التاريخ:</label>
            <input type="date" name="voucher_date" value="{{ today }}" required>
          </div>
          <div>
            <label>المورد / الجهة:</label>
            <input name="supplier" value="{{ carried_data['supplier'] if carried_data and carried_data['supplier'] else '' }}" placeholder="اسم المورد أو القسم الطالب" required>
          </div>
          <div>
            <label>رقم الفاتورة / الإشاري:</label>
            <input name="invoice_no" placeholder="رقم الفاتورة (اختياري)">
          </div>
          <div>
            <label>اسم المستلم:</label>
            <input name="receiver_name" placeholder="اسم المستلم">
          </div>
        </div>
        
        <h4 style="margin-top: 15px; color: #4facfe; font-size: 15px; text-align: center; margin-bottom: 10px;">الأصناف والمواد:</h4>
        
        <div id="items-container">
          <div class="row item-row">
            <!-- قائمة تصفية الأقسام المأخوذة من قاعدة البيانات/الإكسل -->
            <select name="category_filter[]" class="category-filter" onchange="filterItems(this)">
              <option value="">-- اختر القسم --</option>
              {% for cat in categories %}
              <option value="{{ cat.category }}">{{ cat.category }}</option>
              {% endfor %}
            </select>
            
            <!-- قائمة الأصناف المرتبطة بالقسم -->
            <select name="item_name[]" class="item-select" required>
              <option value="">-- اختر الصنف --</option>
              {% for item in items %}
              <option value="{{ item.name }}" data-category="{{ item.category }}">{{ item.name }} ({{ item.unit }})</option>
              {% endfor %}
            </select>
            
            <input type="number" step="0.01" name="qty[]" placeholder="الكمية" value="1" min="1" required>
            <input type="number" step="0.01" name="price[]" placeholder="السعر" value="0.00" required>
            
            <a href="{{ url_for('items') }}" target="_blank" class="add-new-btn" title="إضافة صنف جديد للقاعدة"><i class="fa-solid fa-plus"></i></a>
          </div>
        </div>
        
        <button type="button" class="btn btn-primary" onclick="addRow()" style="margin-top: 10px; font-size: 13px; width: auto; padding: 8px 20px;">+ إضافة سطر آخر</button>
        
        <button type="submit" class="btn btn-success" style="margin-top: 20px;">💾 حفظ الطلب وتسجيل البيانات</button>
      </form>
    </div>
  </div>

  <script>
    function filterItems(categorySelect) {
      const row = categorySelect.closest('.item-row');
      const itemSelect = row.querySelector('.item-select');
      const selectedCategory = categorySelect.value;
      const options = itemSelect.querySelectorAll('option');

      itemSelect.value = ""; 
      options.forEach(option => {
        if (option.value === "") return;
        if (selectedCategory === "" || option.getAttribute('data-category') === selectedCategory) {
          option.style.display = '';
        } else {
          option.style.display = 'none';
        }
      });
    }

    function addRow() {
      const container = document.getElementById('items-container');
      const newRow = document.createElement('div');
      newRow.className = 'row item-row';
      
      newRow.innerHTML = `
        <select name="category_filter[]" class="category-filter" onchange="filterItems(this)">
          <option value="">-- اختر القسم --</option>
          {% for cat in categories %}
          <option value="{{ cat.category }}">{{ cat.category }}</option>
          {% endfor %}
        </select>
        <select name="item_name[]" class="item-select" required>
          <option value="">-- اختر الصنف --</option>
          {% for item in items %}
          <option value="{{ item.name }}" data-category="{{ item.category }}">{{ item.name }} ({{ item.unit }})</option>
          {% endfor %}
        </select>
        <input type="number" step="0.01" name="qty[]" placeholder="الكمية" value="1" min="1" required>
        <input type="number" step="0.01" name="price[]" placeholder="السعر" value="0.00" required>
        <a href="{{ url_for('items') }}" target="_blank" class="add-new-btn" title="إضافة صنف جديد"><i class="fa-solid fa-plus"></i></a>
      `;
      
      container.appendChild(newRow);
    }
  </script>
</body>
</html>
