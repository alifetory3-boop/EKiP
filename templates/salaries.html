<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة الرواتب والموظفين - شركة أكيپ للإنشاءات</title>
    <!-- مكتبة Select2 للبحث السريع -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <style>
        body { font-family: 'Traditional Arabic', 'Tahoma', sans-serif; background-color: #0f172a; color: #fff; padding: 15px; direction: rtl; }
        .panel-box { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 15px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .panel-title { font-size: 15px; font-weight: bold; color: #38bdf8; margin-bottom: 12px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; align-items: end; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 5px; color: #cbd5e1; font-weight: bold; }
        .form-group input, .form-group select { width: 100%; padding: 7px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 12px; color: #000; box-sizing: border-box; }
        
        /* تنسيق خط محرك البحث Select2 ليكون أسود وبنفس حجم ونمط إيصال الصرف */
        .select2-container { width: 100% !important; }
        .select2-container .select2-selection--single { height: 32px !important; background: #f8fafc !important; border: 1px solid #cbd5e1 !important; border-radius: 4px !important; }
        .select2-container--default .select2-selection--single .select2-selection__rendered { line-height: 30px !important; color: #000 !important; font-family: 'Traditional Arabic', 'Tahoma', sans-serif !important; font-size: 13px !important; font-weight: bold !important; }
        .select2-results__option { font-family: 'Traditional Arabic', 'Tahoma', sans-serif !important; color: #000 !important; font-size: 12px !important; }

        .btn-action { background: #10b981; color: white; border: none; padding: 8px 15px; font-size: 13px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; }
        .btn-action:hover { background: #059669; }

        .btn-excel { background: #047857; color: white; border: none; padding: 8px 15px; font-size: 13px; font-weight: bold; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; margin-bottom: 10px; }
        .btn-excel:hover { background: #065f46; }

        .table-custom { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; background: #1e293b; }
        .table-custom th, .table-custom td { border: 1px solid #334155; padding: 8px; text-align: center; }
        .table-custom th { background: #0ea5e9; color: #fff; }
        .btn-delete { background: #ef4444; color: white; border: none; padding: 4px 10px; border-radius: 3px; cursor: pointer; font-size: 11px; }
    </style>
</head>
<body>

    <!-- قسم رصد وصرف راتب ومستحقات (يرسل إلى /salaries ويفتح الإيصال بـ target="_blank") -->
    <div class="panel-box">
        <div class="panel-title">📌 رصد وصرف راتب ومستحقات</div>
        <form action="/salaries" method="POST" target="_blank">
            <div class="form-grid">
                <!-- قائمة البحث السريع للموظف -->
                <div class="form-group">
                    <label>اختر الموظف (بحث سريع)</label>
                    <select id="employeeSelect" name="employee_id" required>
                        <option value="">-- اختر الموظف --</option>
                        {% for emp in employees %}
                        <option value="{{ emp.id }}" data-basic="{{ emp.default_salary }}">{{ emp.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- خانة الراتب الأساسي التلقائية -->
                <div class="form-group">
                    <label>الراتب الأساسي</label>
                    <input type="number" id="basicSalary" name="basic_salary" value="0" readonly>
                </div>

                <div class="form-group">
                    <label>الخصومات / الجزاءات</label>
                    <input type="number" name="deductions" value="0">
                </div>

                <div class="form-group">
                    <label>المكافأة / الإضافي</label>
                    <input type="number" name="bonuses" value="0">
                </div>

                <div class="form-group">
                    <label>السلفة</label>
                    <input type="number" name="advance" value="0">
                </div>

                <div class="form-group">
                    <label>نوع الإيصال</label>
                    <select name="bonus_receipt_type">
                        <option value="separate">إيصال صرف راتب ومستحقات</option>
                        <option value="bonus">إيصال مكافأة مستقلة</option>
                        <option value="advance">إيصال سلفة</option>
                    </select>
                </div>

                <!-- خانة التاريخ الشاملة (اليوم / الشهر / السنة) -->
                <div class="form-group">
                    <label>التاريخ (يوم / شهر / سنة)</label>
                    <input type="date" id="salaryFullDate" name="month_year" required>
                </div>

                <div class="form-group">
                    <button type="submit" class="btn-action">💾 حفظ ورصد</button>
                </div>
            </div>
        </form>
    </div>

    <!-- قسم إدارة الموظفين والرواتب الأساسية -->
    <div class="panel-box">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div class="panel-title" style="border: none; margin: 0;">👥 إدارة الموظفين والرواتب الأساسية</div>
            <!-- زر تصدير كشف الموظفين إلى إكسل -->
            <button onclick="exportToExcel()" class="btn-excel">📊 تصدير كشف الموظفين (Excel)</button>
        </div>

        <table class="table-custom" id="employeesTable">
            <thead>
                <tr>
                    <th style="width: 50px;">م</th>
                    <th>اسم الموظف والراتب الأساسي</th>
                    <th>الراتب الأساسي</th>
                    <th style="width: 80px;">الإجراء</th>
                </tr>
            </thead>
            <tbody>
                {% for emp in employees %}
                <tr>
                    <td>{{ loop.index }}</td>
                    <td>{{ emp.name }}</td>
                    <td>{{ emp.default_salary }} د.ل</td>
                    <td>
                        <form action="/salaries" method="POST" style="display:inline;">
                            <input type="hidden" name="action" value="delete_employee">
                            <input type="hidden" name="emp_id" value="{{ emp.id }}">
                            <button type="submit" class="btn-delete" onclick="return confirm('هل أنت متأكد من الحذف؟')">حذف</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <!-- مكتبات وسكربتات التشغيل والتنسيق -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <!-- مكتبة تصدير الإكسل SheetJS -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <script>
        $(document).ready(function() {
            // تفعيل البحث السريع
            $('#employeeSelect').select2({
                placeholder: "-- ابحث عن اسم الموظف --",
                allowClear: true
            });

            // جلب وعرض الراتب الأساسي تلقائياً فور اختيار الموظف
            $('#employeeSelect').on('change select2:select', function() {
                var selectedOption = $(this).find(':selected');
                var basicSalary = selectedOption.attr('data-basic') || 0;
                $('#basicSalary').val(basicSalary);
            });

            // تحديد تاريخ اليوم تلقائياً بصيغة يوم/شهر/سنة
            const today = new Date().toISOString().split('T')[0];
            $('#salaryFullDate').val(today);
        });

        // دالة تصدير كشف الموظفين لملف إكسل
        function exportToExcel() {
            var table = document.getElementById("employeesTable");
            var wb = XLSX.utils.table_to_book(table, {sheet: "كشف الموظفين"});
            XLSX.writeFile(wb, "كشف_الموظفين_والرواتب.xlsx");
        }
    </script>

</body>
</html>
