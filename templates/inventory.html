<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>الجرد العام - المركب الرياضي بالمرج</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', Tahoma, sans-serif; }
    body { background: url('{{ url_for("static", filename="stadium.jpg") }}') no-repeat center center fixed; background-size: cover; min-height: 100vh; padding: 15px; color: #fff; }
    header { background: rgba(15, 32, 39, 0.9); backdrop-filter: blur(15px); padding: 10px 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); }
    header a { color: #4facfe; text-decoration: none; font-weight: 700; font-size: 13px; background: rgba(255,255,255,0.08); padding: 5px 12px; border-radius: 6px; }
    .box { background: rgba(15, 32, 39, 0.85); backdrop-filter: blur(15px); padding: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
    input, button { padding: 6px 10px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.2); font-size: 12px; font-weight: 600; }
    input { background: rgba(255,255,255,0.95); color: #000; }
    button { background: #2980b9; color: #fff; border: none; cursor: pointer; font-weight: 700; transition: 0.3s; }
    button:hover { background: #2471a3; }
    .table-responsive { width: 100%; overflow-x: auto; max-height: 450px; overflow-y: auto; margin-top: 12px; }
    table { width: 100%; border-collapse: collapse; text-align: center; }
    th, td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 12px; }
    th { background: rgba(0,0,0,0.5); color: #4facfe; position: sticky; top: 0; font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <div style="font-weight: 800; font-size: 16px;"><i class="fa-solid fa-warehouse"></i> تقرير الجرد والمخزون</div>
    <a href="{{ url_for('dashboard') }}"><i class="fa-solid fa-arrow-right"></i> الرئيسية</a>
  </header>
  <div class="box">
    <form method="get" style="display: flex; gap: 10px; align-items: center;">
      <label style="font-size: 12px; font-weight: 600; color: #cbd5e0;">إلى تاريخ:</label>
      <input type="date" name="to_date" value="{{ to_date }}">
      <button type="submit"><i class="fa-solid fa-filter"></i> عرض الجرد</button>
    </form>
    <div class="table-responsive">
      <table>
        <thead>
          <tr><th>الكود</th><th>الصنف</th><th>الوحدة</th><th>الداخل (+)</th><th>الخارج (-)</th><th>الرصيد المتبقي</th></tr>
        </thead>
        <tbody>
          {% for item in inventory_data %}
          <tr>
            <td>{{ item.code }}</td>
            <td style="font-weight: 700; text-align: right; padding-right: 10px;">{{ item.name }}</td>
            <td>{{ item.unit }}</td>
            <td style="color: #2ecc71; font-weight: 700;">{{ item.in_qty }}</td>
            <td style="color: #e74c3c; font-weight: 700;">{{ item.out_qty }}</td>
            <td style="font-weight: 800; color: #4facfe;">{{ item.balance }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
